name: Renderer template restore QA
on:
  push:
    branches:
      - qa-restore-715d9ff
permissions:
  contents: read
concurrency:
  group: renderer-restore-715d9ff
  cancel-in-progress: true
jobs:
  restore:
    if: github.repository == '18823302639/contenthub-renderer' && github.ref == 'refs/heads/qa-restore-715d9ff'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact timeline candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8210e6d7c289525ffbe4fc05140ef6e9b34c9bfd
          persist-credentials: false
      - name: Set up Node 24.22.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact dependencies, lint and bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8210e6d7c289525ffbe4fc05140ef6e9b34c9bfd'
          test ! -f .env
          node --version
          npm --version
          export CI=true
          export REMOTION_DISABLE_TELEMETRY=1
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          git diff --exit-code -- package.json package-lock.json
      - name: Prepare official Noto CJK font and sandboxed browser
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          work="$(mktemp -d "$RUNNER_TEMP/renderer-synthetic.XXXXXX")"
          echo "RENDERER_QA_DIR=$work" >> "$GITHUB_ENV"
          (
            cd "$work"
            apt-get download 'fonts-noto-cjk=1:20220127+repack1-1'
            deb="$(find . -maxdepth 1 -name 'fonts-noto-cjk_*_all.deb' -print -quit)"
            test -n "$deb"
            dpkg-deb -x "$deb" "$work/noto"
          )
          mkdir -p "$HOME/.local/share/fonts"
          cp "$work/noto/usr/share/fonts/opentype/noto/"NotoSansCJK-*.ttc "$HOME/.local/share/fonts/"
          fc-cache "$HOME/.local/share/fonts"
          test "$(fc-match -f '%{family}' 'Noto Sans CJK SC')" = 'Noto Sans CJK SC'
          command -v google-chrome
          google-chrome --version
          cat > "$work/sandboxed-chrome" <<'BROWSER'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$(id -u)" -ne 0
          for arg in "$@"; do
            case "$arg" in
              --no-sandbox*|--disable-setuid-sandbox*|--disable-namespace-sandbox*|--disable-seccomp-filter-sandbox*|--disable-gpu-sandbox*|--single-process*|--no-zygote*)
                echo "Refusing to launch Chromium without its sandbox protections" >&2
                exit 79
                ;;
            esac
          done
          exec google-chrome "$@"
          BROWSER
          chmod 0700 "$work/sandboxed-chrome"
      - name: Render and validate three synthetic stills
        run: |
          set -euo pipefail
          export REMOTION_DISABLE_TELEMETRY=1
          work="$RENDERER_QA_DIR"
          flags='{"no-sandbox":false,"disable-setuid-sandbox":false,"disable-namespace-sandbox":false,"disable-seccomp-filter-sandbox":false,"disable-gpu-sandbox":false,"single-process":false,"no-zygote":false}'
          for comp in MyComposition DataStory-16x9 DataStory-9x16; do
            npx --no-install remotion still src/index.ts "$comp" "$work/$comp.png" \
              --frame=30 --image-format=png --browser-executable="$work/sandboxed-chrome" \
              --chrome-mode=chrome-for-testing --chromium-flags="$flags"
          done
          python3 - <<'PY'
          import os, pathlib, struct, subprocess
          base = pathlib.Path(os.environ["RENDERER_QA_DIR"])
          for name, dimensions in (("MyComposition", (1920, 1080)), ("DataStory-16x9", (1920, 1080)), ("DataStory-9x16", (1080, 1920))):
              image = base / (name + ".png")
              data = image.read_bytes()
              assert len(data) > 1000 and data[:8] == b"\x89PNG\r\n\x1a\n" and data[12:16] == b"IHDR", name
              assert struct.unpack(">II", data[16:24]) == dimensions, name
              colors = int(subprocess.check_output(["identify", "-format", "%k", str(image)], text=True))
              assert colors > 5, name + " rendered blank"
              print(f"{name}: valid synthetic PNG {dimensions[0]}x{dimensions[1]}")
          PY
      - name: Verify sequential timeline and fractional boundaries in both orientations
        run: |
          set -euo pipefail
          work="$RENDERER_QA_DIR"
          export REMOTION_DISABLE_TELEMETRY=1
          export NO_COLOR=1
          flags='{"no-sandbox":false,"disable-setuid-sandbox":false,"disable-namespace-sandbox":false,"disable-seccomp-filter-sandbox":false,"disable-gpu-sandbox":false,"single-process":false,"no-zygote":false}'
          browser=(--browser-executable="$work/sandboxed-chrome" --chrome-mode=chrome-for-testing --chromium-flags="$flags")
          files=(--image-format=png '--image-sequence-pattern=frame-[frame].[ext]' --concurrency=1)
          basic='{"title":"QA alternative title","source":"QA alternative source"}'
          custom='{"title":"QA fractional title","source":"QA fractional source","scenes":[{"heading":"QA first","caption":"QA first caption","durationInSeconds":1.25,"chartData":[{"label":"A","value":50}]},{"heading":"QA second","caption":"QA second caption","durationInSeconds":0.77,"chartData":[{"label":"B","value":75}]}]}'
          custom_alt="${custom//QA second/QA changed second}"
          npx --no-install remotion compositions src/index.ts "${browser[@]}" > "$work/default-metadata.txt"
          npx --no-install remotion compositions src/index.ts "${browser[@]}" --props="$custom" > "$work/custom-metadata.txt"
          for comp in DataStory-16x9 DataStory-9x16; do
            mkdir "$work/$comp-base" "$work/$comp-alt" "$work/$comp-custom" "$work/$comp-custom-alt"
            npx --no-install remotion render src/index.ts "$comp" "$work/$comp-base" "${browser[@]}" "${files[@]}" --frames=20,35,59,60,175,209,210,240,269
            npx --no-install remotion render src/index.ts "$comp" "$work/$comp-alt" "${browser[@]}" "${files[@]}" --frames=20,35,59,60,175,209,210,240,269 --props="$basic"
            npx --no-install remotion render src/index.ts "$comp" "$work/$comp-custom" "${browser[@]}" "${files[@]}" --frames=20,59,60,90,97,98,100,120,121,145,180 --props="$custom"
            npx --no-install remotion render src/index.ts "$comp" "$work/$comp-custom-alt" "${browser[@]}" "${files[@]}" --frames=20,59,60,90,97,98,100,120,121,145,180 --props="$custom_alt"
          done
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          from hashlib import sha256
          root = pathlib.Path(os.environ["RENDERER_QA_DIR"])
          signal = re.compile(r"frame-(\d+)\.png")
          def frames(dirname):
              return {int(signal.fullmatch(p.name)[1]): p for p in dirname.glob("frame-*.png")}
          def hash_pixels(path):
              return sha256(subprocess.check_output(["convert", str(path), "-depth", "8", "rgb:-"])).digest()
          def rgb_maximum(path):
              return max(map(float, subprocess.check_output(["convert", str(path), "-format", "%[fx:maxima.r] %[fx:maxima.g] %[fx:maxima.b]", "info:"], text=True).split()))
          for comp, dims in (("DataStory-16x9","1920x1080"), ("DataStory-9x16","1080x1920")):
              for f, count in (("default-metadata.txt",270), ("custom-metadata.txt",181)):
                  assert re.search(rf"^\s*{comp}\s+30\s+{dims}\s+{count} \(", (root / f).read_text(), re.M), (comp, f)
              base, alt = frames(root / (comp + "-base")), frames(root / (comp + "-alt"))
              custom, changed = frames(root / (comp + "-custom")), frames(root / (comp + "-custom-alt"))
              def equal(one, two, f):
                  return hash_pixels(one[f]) == hash_pixels(two[f])
              assert all(not equal(base, alt, f) for f in (20,35,59,240,269)), comp + " intro/outro text not visible"
              assert all(equal(base, alt, f) for f in (60,175,209,210)), comp + " title/credit leaked across boundary"
              assert all(rgb_maximum(base[f]) > 0.26 for f in (175,209,240)), comp + " content disappeared"
              assert hash_pixels(base[269]) != hash_pixels(base[210]), comp + " last frame is blank instead of a fade"
              assert all(equal(custom, changed, f) for f in (20,59,60,90,97,121,145,180)), comp + " scene 2 leaked across source-time boundary"
              assert all(not equal(custom, changed, f) for f in (100,120)), comp + " scene 2 not visible before outro"
              assert hash_pixels(custom[97]) != hash_pixels(custom[98]), comp + " fractional scene boundary did not advance"
              assert rgb_maximum(custom[145]) > 0.26 and hash_pixels(custom[180]) != hash_pixels(custom[121]), comp + " fractional timeline has blank tail"
              print(f"{comp}: 270-frame default, 181-frame fractional, title before scenes, fractional scene switch 97→98, source credit to final frame")
          PY
