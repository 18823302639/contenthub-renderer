name: Renderer template restore QA
on:
  push:
    branches:
      - qa-restore-715d9ff
permissions:
  contents: read
concurrency:
  group: renderer-restore-715d9ff
  cancel-in-progress: true
jobs:
  restore:
    if: github.repository == '18823302639/contenthub-renderer' && github.ref == 'refs/heads/qa-restore-715d9ff'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact type-only candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 423de3c897fb3d32293e27fa38ecf278baa12a45
          persist-credentials: false
      - name: Set up Node 24.22.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install exact dependencies, lint and bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '423de3c897fb3d32293e27fa38ecf278baa12a45'
          test ! -f .env
          node --version
          npm --version
          export CI=true
          export REMOTION_DISABLE_TELEMETRY=1
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          git diff --exit-code -- package.json package-lock.json
      - name: Prepare official Noto CJK font and sandboxed browser
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          work="$(mktemp -d "$RUNNER_TEMP/renderer-synthetic.XXXXXX")"
          echo "RENDERER_QA_DIR=$work" >> "$GITHUB_ENV"
          (
            cd "$work"
            apt-get download 'fonts-noto-cjk=1:20220127+repack1-1'
            deb="$(find . -maxdepth 1 -name 'fonts-noto-cjk_*_all.deb' -print -quit)"
            test -n "$deb"
            dpkg-deb -x "$deb" "$work/noto"
          )
          mkdir -p "$HOME/.local/share/fonts"
          cp "$work/noto/usr/share/fonts/opentype/noto/"NotoSansCJK-*.ttc "$HOME/.local/share/fonts/"
          fc-cache "$HOME/.local/share/fonts"
          test "$(fc-match -f '%{family}' 'Noto Sans CJK SC')" = 'Noto Sans CJK SC'
          command -v google-chrome
          google-chrome --version
          cat > "$work/sandboxed-chrome" <<'BROWSER'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$(id -u)" -ne 0
          for arg in "$@"; do
            case "$arg" in
              --no-sandbox*|--disable-setuid-sandbox*|--disable-namespace-sandbox*|--disable-seccomp-filter-sandbox*|--disable-gpu-sandbox*|--single-process*|--no-zygote*)
                echo "Refusing to launch Chromium without its sandbox protections" >&2
                exit 79
                ;;
            esac
          done
          exec google-chrome "$@"
          BROWSER
          chmod 0700 "$work/sandboxed-chrome"
      - name: Render and validate three synthetic stills
        run: |
          set -euo pipefail
          export REMOTION_DISABLE_TELEMETRY=1
          work="$RENDERER_QA_DIR"
          flags='{"no-sandbox":false,"disable-setuid-sandbox":false,"disable-namespace-sandbox":false,"disable-seccomp-filter-sandbox":false,"disable-gpu-sandbox":false,"single-process":false,"no-zygote":false}'
          for comp in MyComposition DataStory-16x9 DataStory-9x16; do
            npx --no-install remotion still src/index.ts "$comp" "$work/$comp.png" \
              --frame=30 --image-format=png --browser-executable="$work/sandboxed-chrome" \
              --chrome-mode=chrome-for-testing --chromium-flags="$flags"
          done
          python3 - <<'PY'
          import os, pathlib, struct, subprocess
          base = pathlib.Path(os.environ["RENDERER_QA_DIR"])
          for name, dimensions in (("MyComposition", (1920, 1080)), ("DataStory-16x9", (1920, 1080)), ("DataStory-9x16", (1080, 1920))):
              image = base / (name + ".png")
              data = image.read_bytes()
              assert len(data) > 1000 and data[:8] == b"\x89PNG\r\n\x1a\n" and data[12:16] == b"IHDR", name
              assert struct.unpack(">II", data[16:24]) == dimensions, name
              colors = int(subprocess.check_output(["identify", "-format", "%k", str(image)], text=True))
              assert colors > 5, name + " rendered blank"
              print(f"{name}: valid synthetic PNG {dimensions[0]}x{dimensions[1]}")
          PY
      - name: Observe synthetic template timeline without changing source
        run: |
          set -euo pipefail
          export REMOTION_DISABLE_TELEMETRY=1
          work="$RENDERER_QA_DIR"
          flags='{"no-sandbox":false,"disable-setuid-sandbox":false,"disable-namespace-sandbox":false,"disable-seccomp-filter-sandbox":false,"disable-gpu-sandbox":false,"single-process":false,"no-zygote":false}'
          for comp in DataStory-16x9 DataStory-9x16; do
            mkdir "$work/$comp-base" "$work/$comp-alt"
            common=(--frames=20,35,175,240,269 --image-format=png '--image-sequence-pattern=frame-[frame].[ext]' --concurrency=1 --browser-executable="$work/sandboxed-chrome" --chrome-mode=chrome-for-testing --chromium-flags="$flags")
            npx --no-install remotion render src/index.ts "$comp" "$work/$comp-base" "${common[@]}"
            npx --no-install remotion render src/index.ts "$comp" "$work/$comp-alt" "${common[@]}" --props='{"title":"QA alternative title","source":"QA alternative source"}'
          done
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ["RENDERER_QA_DIR"])
          number = re.compile(r"frame-(\d+)\.png")
          def frames(dirname):
              found = {int(number.fullmatch(p.name)[1]): p for p in dirname.glob("frame-*.png")}
              assert set(found) == {20, 35, 175, 240, 269}, sorted(found)
              return found
          def image_hash(path):
              return hashlib.sha256(subprocess.check_output(["convert", str(path), "-depth", "8", "rgb:-"])).hexdigest()
          def channel_max(path):
              return max(map(float, subprocess.check_output(["convert", str(path), "-format", "%[fx:maxima.r] %[fx:maxima.g] %[fx:maxima.b]", "info:"], text=True).split()))
          for comp in ("DataStory-16x9", "DataStory-9x16"):
              base, alt = frames(root / (comp + "-base")), frames(root / (comp + "-alt"))
              title_changes_pixels = {f: image_hash(base[f]) != image_hash(alt[f]) for f in (20,35)}
              source_changes_pixels = image_hash(base[175]) != image_hash(alt[175])
              tail_identical = image_hash(base[240]) == image_hash(base[269])
              tail_max = channel_max(base[240])
              print(f"{comp}: early title changes pixels {title_changes_pixels}; source changes frame 175 pixels {source_changes_pixels}; tail 240 and 269 identical {tail_identical}; tail maximum RGB channel {tail_max:.3f}")
          PY
